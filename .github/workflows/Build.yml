name: Build Folium IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes (for debugging)
        run: xcodebuild -list -project Folium.xcodeproj

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme Folium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Folium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log
        env:
          NSUnbufferedIO: YES

      - name: Verify archive exists
        run: ls -R build/Folium.xcarchive/Products/Applications

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Folium.xcarchive/Products/Applications/*.app Payload/
          zip -r Folium.ipa Payload
          ls -lh Folium.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folium-ipa
          path: Folium.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
