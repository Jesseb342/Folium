name: Build Folium IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      # The project references local Swift packages that live next to the repo
      # (e.g. ../AntiqueKit). Clone any that are missing from the folium-app org.
      - name: Fetch sibling local packages
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys, glob

          ws = os.environ["GITHUB_WORKSPACE"]
          orgs = ["folium-app", "official-antique", "jarrodnorwell"]
          seen = set()
          failed = []

          def refs():
              found = set()
              files = [os.path.join(ws, "Folium.xcodeproj", "project.pbxproj")]
              files += glob.glob(os.path.join(ws, "..", "*", "Package.swift"))
              files += glob.glob(os.path.join(ws, "**", "Package.swift"), recursive=True)
              for f in files:
                  if not os.path.isfile(f):
                      continue
                  base = os.path.dirname(f) if f.endswith("Package.swift") else ws
                  txt = open(f, errors="ignore").read()
                  for m in re.findall(r'relativePath\s*=\s*"?([^";]+)"?;', txt):
                      found.add(os.path.normpath(os.path.join(base, m.strip())))
                  for m in re.findall(r'path:\s*"(\.\./[^"]+)"', txt):
                      found.add(os.path.normpath(os.path.join(base, m)))
              return found

          for _ in range(5):
              new = [p for p in refs() if p not in seen]
              if not new:
                  break
              for p in new:
                  seen.add(p)
                  if os.path.exists(p):
                      continue
                  parent = os.path.normpath(os.path.join(ws, ".."))
                  if not p.startswith(parent + os.sep):
                      print("skipping outside path", p)
                      continue
                  name = os.path.relpath(p, parent).split(os.sep)[0]
                  dest = os.path.join(parent, name)
                  if os.path.exists(dest):
                      continue
                  print("cloning", name, "->", dest)
                  ok = False
                  for o in orgs:
                      env = dict(os.environ, GIT_TERMINAL_PROMPT="0")
                      r = subprocess.run(["git", "clone", "--depth", "1", "--recursive",
                                          f"https://github.com/{o}/{name}", dest], env=env)
                      if r.returncode == 0:
                          print(f"cloned {o}/{name}")
                          ok = True
                          break
                  if not ok:
                      failed.append(name)

          print("local package paths found:", sorted(seen))
          if failed:
              print(f"::error::could not clone: {failed}")
              sys.exit(1)
          PY
          ls -la "$GITHUB_WORKSPACE/.."

      - name: List schemes
        run: xcodebuild -list -project Folium.xcodeproj

      - name: Pick scheme
        id: scheme
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          out = subprocess.run(["xcodebuild", "-list", "-json", "-project", "Folium.xcodeproj"],
                               capture_output=True, text=True).stdout
          schemes = json.loads(out[out.index("{"):])["project"]["schemes"]
          print("schemes:", schemes)
          pick = next((s for s in schemes if s == "Folium-iOS"), None) \
              or next((s for s in schemes if "ios" in s.lower()), None) \
              or next((s for s in schemes if s == "Folium"), None) \
              or schemes[0]
          print("using:", pick)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"name={pick}\n")
          PY

      # nihstro (inside SharedDependencies) compiles from source and needs the
      # Boost headers (fusion, spirit, phoenix), which aren't in the checkout.
      - name: Install Boost and Vulkan headers
        run: |
          FORMULAE="boost vulkan-headers vulkan-memory-allocator glslang spirv-headers"
          brew install $FORMULAE
          SPACE=""
          COLON=""
          for f in $FORMULAE; do
            inc="$(brew --prefix $f)/include"
            [ -d "$inc" ] && SPACE="$SPACE $inc" && COLON="$COLON:$inc"
          done
          echo "include dirs:$SPACE"
          ls "$(brew --prefix boost)/include/boost/fusion/include/adapt_struct.hpp"
          ls "$(brew --prefix vulkan-headers)/include/vulkan/vulkan.hpp"
          ls "$(brew --prefix vulkan-memory-allocator)/include/vk_mem_alloc.h"
          echo "EXTRA_INC=$SPACE" >> "$GITHUB_ENV"
          echo "EXTRA_INC_COLON=${COLON#:}" >> "$GITHUB_ENV"
          echo "EXTRA_ISYSTEM=$(for d in $SPACE; do printf -- '-isystem %s ' $d; done)" >> "$GITHUB_ENV"

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Folium.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            HEADER_SEARCH_PATHS="\$(inherited) $EXTRA_INC" \
            OTHER_CPLUSPLUSFLAGS="\$(inherited) $EXTRA_ISYSTEM" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log
        env:
          NSUnbufferedIO: YES
          CPLUS_INCLUDE_PATH: ${{ env.EXTRA_INC_COLON }}

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo '### Compile errors'
            echo '```'
            grep -n -E "(fatal error|error):" build/xcodebuild.log | grep -v "ARCHIVE FAILED" | head -40
            echo '--- context around preprocessor.cpp ---'
            grep -n -B2 -A12 "preprocessor.cpp:[0-9]" build/xcodebuild.log | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify archive exists
        run: ls -R build/Folium.xcarchive/Products/Applications

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Folium.xcarchive/Products/Applications/*.app Payload/
          zip -r Folium.ipa Payload
          ls -lh Folium.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folium-ipa
          path: Folium.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

